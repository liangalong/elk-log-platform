input {
  beats {
    port => 5044
  }
}

filter {
  # 解析 Docker JSON 日志
  json {
    source => "message"
    target => "parsed"
  }
  
  # 提取日志级别
  if [parsed][level] {
    mutate {
      add_field => { "log_level" => "%{[parsed][level]}" }
    }
  }
  
  # 提取应用名称
  if [parsed][app] {
    mutate {
      add_field => { "app_name" => "%{[parsed][app]}" }
    }
  }
  
  # 解析 Java 异常堆栈，合并为多行
  if [parsed][logger] {
    mutate {
      add_field => { "class_name" => "%{[parsed][logger]}" }
    }
  }
  
  # 时间处理
  if [parsed][@timestamp] {
    date {
      match => ["[parsed][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  # 提取请求路径和耗时
  if [parsed][uri] {
    mutate {
      add_field => {
        "request_uri" => "%{[parsed][uri]}"
        "response_time_ms" => "%{[parsed][duration]}"
      }
    }
  }
  
  # 移除冗余字段
  mutate {
    remove_field => ["message", "parsed", "input", "ecs", "agent", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  # stdout { codec => rubydebug }
}